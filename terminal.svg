<svg width="620" height="320" viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .l1 { animation: a1 14s infinite; opacity: 0; }
      .l2 { animation: a2 14s infinite; opacity: 0; }
      .l3 { animation: a3 14s infinite; opacity: 0; }
      .l4 { animation: a4 14s infinite; opacity: 0; }
      .l5 { animation: a5 14s infinite; opacity: 0; }
      .l6 { animation: a6 14s infinite; opacity: 0; }
      .l7 { animation: a7 14s infinite; opacity: 0; }
      .l8 { animation: a8 14s infinite; opacity: 0; }
      .l9 { animation: a9 14s infinite; opacity: 0; }
      .l10 { animation: a10 14s infinite; opacity: 0; }
      .cursor { animation: blink 1s infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes a1  { 0%{opacity:0} 5%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a2  { 0%{opacity:0} 12%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a3  { 0%{opacity:0} 19%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a4  { 0%{opacity:0} 26%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a5  { 0%{opacity:0} 33%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a6  { 0%{opacity:0} 40%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a7  { 0%{opacity:0} 47%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a8  { 0%{opacity:0} 54%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a9  { 0%{opacity:0} 61%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
      @keyframes a10 { 0%{opacity:0} 68%{opacity:1} 85%{opacity:1} 92%{opacity:0} 100%{opacity:0} }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="620" height="320" rx="12" fill="#0d1117"/>
  <!-- Title bar -->
  <rect width="620" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="620" height="12" fill="#161b22"/>
  <!-- Window buttons -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <!-- Title -->
  <text x="310" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">mahesh@devops: ~</text>

  <!-- Line 1: prompt + command -->
  <g class="l1">
    <text x="16" y="66" font-family="monospace" font-size="13" fill="#00d4ff">mahesh@devops:~$</text>
    <text x="182" y="66" font-family="monospace" font-size="13" fill="#e6edf3"> kubectl get pods -n production</text>
  </g>
  <!-- Line 2: output header -->
  <g class="l2">
    <text x="16" y="86" font-family="monospace" font-size="12" fill="#6e7681">NAME                    READY   STATUS    RESTARTS</text>
  </g>
  <!-- Line 3: pod 1 -->
  <g class="l3">
    <text x="16" y="104" font-family="monospace" font-size="12" fill="#3fb950">nginx-deploy-xk2p9      1/1     Running   0</text>
  </g>
  <!-- Line 4: pod 2 -->
  <g class="l4">
    <text x="16" y="122" font-family="monospace" font-size="12" fill="#3fb950">api-server-lmn4r        1/1     Running   0</text>
  </g>
  <!-- Line 5: blank + next prompt -->
  <g class="l5">
    <text x="16" y="148" font-family="monospace" font-size="13" fill="#00d4ff">mahesh@devops:~$</text>
    <text x="182" y="148" font-family="monospace" font-size="13" fill="#e6edf3"> docker ps --format "{{.Names}}"</text>
  </g>
  <!-- Line 6: docker output -->
  <g class="l6">
    <text x="16" y="168" font-family="monospace" font-size="12" fill="#3fb950">jenkins-master</text>
  </g>
  <g class="l7">
    <text x="16" y="186" font-family="monospace" font-size="12" fill="#3fb950">prometheus-stack</text>
  </g>
  <!-- Line 8: next prompt -->
  <g class="l8">
    <text x="16" y="212" font-family="monospace" font-size="13" fill="#00d4ff">mahesh@devops:~$</text>
    <text x="182" y="212" font-family="monospace" font-size="13" fill="#e6edf3"> terraform apply -auto-approve</text>
  </g>
  <!-- Line 9: terraform output -->
  <g class="l9">
    <text x="16" y="232" font-family="monospace" font-size="12" fill="#6e7681">Apply complete! Resources: 3 added, 0 changed.</text>
  </g>
  <!-- Line 10: aws cmd -->
  <g class="l10">
    <text x="16" y="258" font-family="monospace" font-size="13" fill="#00d4ff">mahesh@devops:~$</text>
    <text x="182" y="258" font-family="monospace" font-size="13" fill="#e6edf3"> aws eks update-kubeconfig --name prod</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="182" y="270" width="8" height="14" fill="#00d4ff"/>
</svg>
